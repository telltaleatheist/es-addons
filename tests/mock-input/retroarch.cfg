## RetroPie's all/retroarch.cfg, trimmed to the shape that matters here:
## ten joypad index lines, a decoy that only looks like one, and a pile of
## unrelated settings the addon must give back byte for byte.

input_joypad_driver = "udev"
input_max_users = "5"
video_smooth = "false"
video_fullscreen = "true"

# the assignment, as RetroPie ships it: player N is pad N-1
input_player1_joypad_index = "0"
input_player2_joypad_index = "1"
input_player3_joypad_index = 2
input_player4_joypad_index = "3"   # spacing and a comment, both kept
input_player5_joypad_index = "4"
input_player6_joypad_index = "5"
input_player7_joypad_index = "6"
input_player8_joypad_index = "7"
input_player9_joypad_index = "8"
input_player10_joypad_index = "9"

# looks like one of ours and is not: there is no eleventh player, and the
# _analog line is a different setting that happens to share a prefix
input_player11_joypad_index = "10"
input_player1_joypad_index_analog = "0"

input_player1_a_btn = "1"
input_player1_b_btn = "0"
input_player1_start_btn = "9"
input_remapping_directory = "/opt/retropie/configs/all/retroarch/config/"

menu_driver = "ozone"
savestate_auto_save = "false"
